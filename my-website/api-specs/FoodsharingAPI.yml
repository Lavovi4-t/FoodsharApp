openapi: 3.0.3

info:
  title: Foodsharing Application API
  description: |
    API для фудшеринг-приложения.
  version: 1.0.0

servers:
  - url: https://api.foodsharing.ru/v1
    description: Production server

tags:
  - name: Auth
    description: Регистрация и вход
  - name: Listings
    description: Объявления (лента, карточка, публикация)
  - name: Bookings
    description: Бронирование и мои бронирования
  - name: Transactions
    description: Подтверждение выдачи и оценка
  - name: Users
    description: Профиль пользователя
  - name: Chat
    description: Чаты и сообщения
  - name: Moderation
    description: Модерация (блокировка нарушителя)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRole:
      type: string
      enum: [guest, provider, receiver, moderator]

    ListingStatus:
      type: string
      enum: [active, booked, completed, cancelled]

    BookingStatus:
      type: string
      enum: [pending, confirmed, cancelled, completed]

    TransactionStatus:
      type: string
      enum: [pending, completed, cancelled]

    Address:
      type: object
      properties:
        region:
          type: string
          example: Moscow
        city:
          type: string
          example: Moscow
        street:
          type: string
          example: Tverskaya
        building:
          type: string
          example: "15"
        apartment:
          type: string
          example: "42"
        coordinates:
          type: object
          properties:
            lat:
              type: number
              format: float
              example: 55.7558
            lon:
              type: number
              format: float
              example: 37.6176

    User:
      type: object
      properties:
        id:
          type: string
          example: USR-4242-2025
        role:
          $ref: '#/components/schemas/UserRole'
        first_name:
          type: string
          example: Anna
        last_name:
          type: string
          example: Petrova
        avatar_url:
          type: string
          format: uri
          example: https://cdn.foodsharing.ru/avatars/usr-4242.jpg
        rating:
          type: number
          format: float
          example: 4.7
          nullable: true
        email:
          type: string
          format: email
          example: anna.petrova@example.com
        phone:
          type: string
          example: "+79991234567"
        is_blocked:
          type: boolean
          example: false
        created_at:
          type: string
          format: date
          example: "2025-01-15"
        total_deals:
          type: integer
          example: 42

    Listing:
      type: object
      properties:
        id:
          type: string
          example: LST-8472-IRT
        provider_id:
          type: string
          example: USR-4242-2025
        provider_name:
          type: string
          example: Anna Petrova
        provider_rating:
          type: number
          format: float
          example: 4.7
        title:
          type: string
          example: Домашний суп с курицей
        description:
          type: string
          example: Свежий суп, разлит по контейнерам. 2 порции.
        photos:
          type: array
          items:
            type: string
            format: uri
          example:
            - https://cdn.foodsharing.ru/listings/photo1.jpg
            - https://cdn.foodsharing.ru/listings/photo2.jpg
        address:
          $ref: '#/components/schemas/Address'
        pickup_time:
          type: string
          format: date-time
          example: "2026-04-15T18:00:00Z"
        portions:
          type: integer
          example: 2
        portions_left:
          type: integer
          example: 1
        status:
          $ref: '#/components/schemas/ListingStatus'
        created_at:
          type: string
          format: date-time
          example: "2026-04-14T10:00:00Z"

    Booking:
      type: object
      properties:
        id:
          type: string
          example: BKG-042-NYC-01
        listing_id:
          type: string
          example: LST-8472-IRT
        listing_title:
          type: string
          example: Домашний суп с курицей
        receiver_id:
          type: string
          example: USR-3210-2025
        receiver_name:
          type: string
          example: Ivan Ivanov
        provider_id:
          type: string
          example: USR-4242-2025
        provider_name:
          type: string
          example: Anna Petrova
        address:
          $ref: '#/components/schemas/Address'
        portions_booked:
          type: integer
          example: 1
        status:
          $ref: '#/components/schemas/BookingStatus'
        booking_time:
          type: string
          format: date-time
          example: "2026-04-14T12:30:00Z"
        pickup_time:
          type: string
          format: date-time
          example: "2026-04-15T18:00:00Z"

    Transaction:
      type: object
      properties:
        id:
          type: string
          example: TR-123-2026
        booking_id:
          type: string
          example: BKG-042-NYC-01
        listing_title:
          type: string
          example: Домашний суп с курицей
        provider_id:
          type: string
          example: USR-4242-2025
        provider_name:
          type: string
          example: Anna Petrova
        receiver_id:
          type: string
          example: USR-3210-2025
        receiver_name:
          type: string
          example: Ivan Ivanov
        address:
          $ref: '#/components/schemas/Address'
        pickup_time:
          type: string
          format: date-time
          example: "2026-04-15T18:00:00Z"
        pickup_confirmed_at:
          type: string
          format: date-time
          nullable: true
        provider_rated:
          type: boolean
          example: false
        receiver_rated:
          type: boolean
          example: false
        status:
          $ref: '#/components/schemas/TransactionStatus'

    Review:
      type: object
      properties:
        id:
          type: string
          example: REV-987-2026
        transaction_id:
          type: string
          example: TR-123-2026
        from_user_id:
          type: string
          example: USR-3210-2025
        from_user_name:
          type: string
          example: Ivan Ivanov
        to_user_id:
          type: string
          example: USR-4242-2025
        to_user_name:
          type: string
          example: Anna Petrova
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        review:
          type: string
          example: Очень вкусный суп, спасибо!
        created_at:
          type: string
          format: date-time
          example: "2026-04-15T19:00:00Z"

    Message:
      type: object
      properties:
        id:
          type: string
          example: MSG-123-2026
        conversation_id:
          type: string
          example: CONV-001
        sender_id:
          type: string
          example: USR-4242-2025
        sender_name:
          type: string
          example: Anna Petrova
        text:
          type: string
          example: Здравствуйте! Когда удобно забрать?
        photo_url:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          example: "2026-04-14T15:30:00Z"
        is_read:
          type: boolean
          example: false

    Conversation:
      type: object
      properties:
        id:
          type: string
          example: CONV-001
        other_user_id:
          type: string
          example: USR-3210-2025
        other_user_name:
          type: string
          example: Ivan Ivanov
        other_user_avatar:
          type: string
          format: uri
        last_message:
          type: string
          example: Здравствуйте! Когда удобно забрать?
        last_message_time:
          type: string
          format: date-time
          example: "2026-04-14T15:30:00Z"
        unread_count:
          type: integer
          example: 2

    Report:
      type: object
      properties:
        id:
          type: string
          example: RPT-2026-001
        reporter_id:
          type: string
          example: USR-3210-2025
        target_user_id:
          type: string
          example: USR-4242-2025
        target_user_name:
          type: string
          example: Anna Petrova
        reason:
          type: string
          example: Грубит в чате
        status:
          type: string
          enum: [pending, approved, rejected]
          example: pending
        created_at:
          type: string
          format: date-time
          example: "2026-04-14T18:00:00Z"

    RegisterRequest:
      type: object
      required: [email, password, agree_to_policy]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 6
          example: "123456"
        agree_to_policy:
          type: boolean
          example: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    CreateListingRequest:
      type: object
      required: [title, address, pickup_time, portions]
      properties:
        title:
          type: string
          example: Домашний суп
        description:
          type: string
          example: Свежий суп
        photos:
          type: array
          items:
            type: string
            format: uri
        address:
          $ref: '#/components/schemas/Address'
        pickup_time:
          type: string
          format: date-time
        portions:
          type: integer
          minimum: 1

    BookListingRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          example: 1

    ConfirmPickupRequest:
      type: object
      properties:
        code:
          type: string

    RateTransactionRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        review:
          type: string
          example: Спасибо!

    SendMessageRequest:
      type: object
      properties:
        text:
          type: string
          example: Привет!
        photo_url:
          type: string
          format: uri
          nullable: true

    BlockUserRequest:
      type: object
      properties:
        reason:
          type: string
          example: Оскорбления в чате

    AuthResponse:
      type: object
      properties:
        user_id:
          type: string
        access_token:
          type: string
        refresh_token:
          type: string

    ListingsListResponse:
      type: object
      properties:
        listings:
          type: array
          items:
            $ref: '#/components/schemas/Listing'
        total:
          type: integer

    BookingsListResponse:
      type: object
      properties:
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
        total:
          type: integer

    ConversationsListResponse:
      type: object
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        total:
          type: integer

    MessagesListResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        total:
          type: integer

    SimpleResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Регистрация нового пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Успешная регистрация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Вход в систему
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /listings:
    get:
      tags: [Listings]
      summary: Главная лента объявлений
      parameters:
        - name: food_type
          in: query
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: number
            format: float
        - name: lon
          in: query
          schema:
            type: number
            format: float
        - name: radius
          in: query
          schema:
            type: integer
            default: 5
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Список карточек объявлений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingsListResponse'
    post:
      tags: [Listings]
      summary: Публикация новой еды (только provider)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'
      responses:
        '201':
          description: Объявление создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'

  /listings/{id}:
    get:
      tags: [Listings]
      summary: Карточка объявления (детальный просмотр)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Детали объявления
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
    put:
      tags: [Listings]
      summary: Редактировать объявление
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'
      responses:
        '200':
          description: Объявление обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
    delete:
      tags: [Listings]
      summary: Удалить объявление
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Объявление удалено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'

  /listings/{id}/book:
    post:
      tags: [Bookings]
      summary: Забронировать еду (только receiver)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookListingRequest'
      responses:
        '200':
          description: Еда забронирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'

  /users/me/listings:
    get:
      tags: [Listings]
      summary: Мои объявления (список с кнопками Удалить/Редактировать)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список объявлений пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingsListResponse'

  /users/me/bookings:
    get:
      tags: [Bookings]
      summary: Мои бронирования (список броней)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BookingStatus'
      responses:
        '200':
          description: Список бронирований
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingsListResponse'

  /transactions/{id}/confirm-pickup:
    post:
      tags: [Transactions]
      summary: Подтвердить выдачу еды (только provider)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPickupRequest'
      responses:
        '200':
          description: Выдача подтверждена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'

  /transactions/{id}/rate:
    post:
      tags: [Transactions]
      summary: Оценить сделку (звезды 1–5 + отзыв)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateTransactionRequest'
      responses:
        '200':
          description: Оценка оставлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'

  /users/me:
    get:
      tags: [Users]
      summary: Профиль пользователя (аватар, имя, рейтинг)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      tags: [Users]
      summary: Редактировать профиль
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                avatar_url:
                  type: string
      responses:
        '200':
          description: Профиль обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      tags: [Users]
      summary: Просмотр профиля другого пользователя
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /conversations:
    get:
      tags: [Chat]
      summary: Список чатов (для нижней навигации)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список чатов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationsListResponse'

  /conversations/{id}/messages:
    get:
      tags: [Chat]
      summary: Область сообщений в чате
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Сообщения чата
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesListResponse'
    post:
      tags: [Chat]
      summary: Отправить сообщение (текст или фото)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Сообщение отправлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /users/{id}/block:
    post:
      tags: [Moderation]
      summary: Заблокировать нарушителя
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockUserRequest'
      responses:
        '200':
          description: Пользователь заблокирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'

  /reports:
    post:
      tags: [Moderation]
      summary: Пожаловаться на пользователя
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_user_id, reason]
              properties:
                target_user_id:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Жалоба отправлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'